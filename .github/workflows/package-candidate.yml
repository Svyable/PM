name: Package PM candidate
on:
  push:
    branches: ['feat/**', 'fix/**', 'release/**']
    paths:
      - 'extension/**'
      - 'scripts/package.mjs'
      - '.github/workflows/package-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pm-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate version
        run: echo "PM_VERSION=$(node -p 'require("./extension/manifest.json").version')" >> "$GITHUB_ENV"
      - name: Check JavaScript
        run: |
          node --check scripts/package.mjs
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
      - name: Build deterministic installer
        run: node scripts/package.mjs --write-repo
      - name: Verify byte-for-byte packaging
        run: |
          node scripts/package.mjs --verify
          unzip -t "docs/downloads/PM-Chrome-Extension-v${PM_VERSION}.zip"
          sha256sum "docs/downloads/PM-Chrome-Extension-v${PM_VERSION}.zip"
      - name: Upload launch candidate
        uses: actions/upload-artifact@v4
        with:
          name: PM-v${{ env.PM_VERSION }}-candidate
          path: docs/downloads/PM-Chrome-Extension-v${{ env.PM_VERSION }}.zip
          if-no-files-found: error
      - name: Commit generated installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo "::warning::Source advanced while packaging. A newer workflow run will rebuild the installer."
            exit 0
          fi
          git add "docs/downloads/PM-Chrome-Extension-v${PM_VERSION}.zip"
          if ! git diff --cached --quiet; then
            git commit -m "Build reproducible PM ${PM_VERSION} installer"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
