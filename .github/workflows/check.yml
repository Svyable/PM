name: Validate PM extension
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/downloads/**'
      - '.github/workflows/check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/project-panel.js
          node --check extension/panel.js
          node --check scripts/package.mjs
          node --check tests/adapter.mock.cjs
          node --check tests/coordinator.mock.cjs
          node --check tests/panel.mock.cjs
      - name: Validate manifest and paths
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('extension/manifest.json'));for(const p of ['background.js','content.js','popup.html','popup.css','popup.js','project-panel.js','panel.html','panel.css','panel.js',...Object.values(m.icons)]){if(!fs.existsSync('extension/'+p))throw Error('Missing: '+p)};if(m.host_permissions.join()!=='https://chatgpt.com/*')throw Error('Unexpected host permissions');if(!m.web_accessible_resources?.some(r=>r.matches?.join()==='https://chatgpt.com/*'&&r.resources.includes('panel.html')))throw Error('Dashboard frame must be restricted to ChatGPT')"
      - name: Mock ChatGPT DOM adapter
        run: node tests/adapter.mock.cjs
      - name: Simulated Chrome service worker coordination
        run: node tests/coordinator.mock.cjs
      - name: Embedded project panel routing
        run: node tests/panel.mock.cjs
      - name: Check v1 launch disclosure files
        run: |
          test -f docs/privacy.html
          test -f docs/V1_LAUNCH_CHECKLIST.md
          test -f docs/STORE_LISTING_DRAFT.md
          grep -q 'privacy.html' docs/index.html
          grep -q 'PM-Chrome-Extension-v0.9.1.zip' docs/index.html
      - name: Verify reproducible installer and every extension file
        run: |
          node scripts/package.mjs --verify
          unzip -t docs/downloads/PM-Chrome-Extension-v0.9.1.zip
          mkdir -p "$RUNNER_TEMP/pm-check"
          unzip -q docs/downloads/PM-Chrome-Extension-v0.9.1.zip -d "$RUNNER_TEMP/pm-check"
          diff -qr extension "$RUNNER_TEMP/pm-check/extension"
          sha256sum docs/downloads/PM-Chrome-Extension-v0.9.1.zip
